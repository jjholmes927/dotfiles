name: Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { dir: upstream-skills, module: test_install }
          - { dir: workflow, module: test_doctor }
          - { dir: workflow, module: test_sync }
          - { dir: codex, module: test_sync_workflow }
          - { dir: codex, module: test_workflow_release }
          - { dir: cursor, module: test_install }
          - { dir: opencode, module: test_install }
          - { dir: kandev, module: test_workflow_pilot }
    name: ${{ matrix.suite.dir }}/${{ matrix.suite.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v ${{ matrix.suite.module }}
        working-directory: ${{ matrix.suite.dir }}

  marketplace-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: jjholmes927/jjholmes927-claude-skills
          path: marketplace
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          WORKFLOW_CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$WORKFLOW_CHANGE_BASE" ] || [ "$WORKFLOW_CHANGE_BASE" = "0000000000000000000000000000000000000000" ]; then
            WORKFLOW_CHANGE_BASE="origin/${{ github.event.repository.default_branch }}"
          fi
          python -B workflow/check-release.py --source marketplace --base "$WORKFLOW_CHANGE_BASE"
